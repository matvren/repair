<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Repair Shop Ledger</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repair Shop">
<meta name="theme-color" id="themeColor" content="#ffffff">
<link rel="icon" id="favicon" href="html-cytech-logo-black.png">
<link rel="apple-touch-icon" id="appleIcon" href="html-cytech-logo-black.png">
<link rel="manifest" id="manifestLink" href="manifest.json">
<script>try{var t=localStorage.getItem('rs_theme');if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f6f6f6;
  --ink:#0f0f0f; --ink-soft:#5c5c5c; --ink-faint:#9c9c9c;
  --line:#e8e8e8; --line-strong:#c9c9c9;
  --btn-bg:#0f0f0f; --btn-ink:#ffffff;
  --nav-bg:#0f0f0f; --nav-ink:#d2d2d2; --nav-active-bg:#ffffff; --nav-active-ink:#0f0f0f;
  --backdrop:rgba(0,0,0,.45);
  --good:#167347;
  --accent:#0f0f0f;
  --bad:#b45309;
  --radius:10px; --radius-sm:6px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0b0b0b; --surface:#101010; --surface-2:#171717;
  --ink:#f2f2f2; --ink-soft:#a3a3a3; --ink-faint:#636363;
  --line:#262626; --line-strong:#404040;
  --btn-bg:#f2f2f2; --btn-ink:#0b0b0b;
  --nav-bg:#060606; --nav-ink:#a8a8a8; --nav-active-bg:#f2f2f2; --nav-active-ink:#0b0b0b;
  --backdrop:rgba(0,0,0,.6);
  --good:#37b26d;
  --accent:#f2f2f2;
  --bad:#e05b26;
  color-scheme:dark;
}
:root[data-theme=blue]{
  --bg:#eef0fd; --surface:#ffffff; --surface-2:#f1f3ff;
  --ink:#10112b; --ink-soft:#4f5478; --ink-faint:#8b90b8;
  --line:#d9ddf5; --line-strong:#a9b0dd;
  --btn-bg:#000cad; --btn-ink:#ffffff;
  --nav-bg:#000cad; --nav-ink:#c9cef6; --nav-active-bg:#ffffff; --nav-active-ink:#000cad;
  --backdrop:rgba(6,0,60,.5);
  --good:#167347;
  --accent:#000cad;
  --bad:#b45309;
  --radius:10px; --radius-sm:6px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
.hidden{display:none !important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- SHELL ---------- */
#app{display:flex;min-height:100vh}
.sidebar{
  width:216px;flex:0 0 216px;background:var(--nav-bg);color:#f2f2f2;
  display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand-mark{width:34px;height:34px;background:var(--nav-active-bg);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;filter:invert(1)}
:root[data-theme=dark] .brand-mark{background:#1e1e1e;border:1px solid #333}
:root[data-theme=blue] .brand-mark{background:#000cad;border:1px solid rgba(255,255,255,.3)}
:root[data-theme=dark] .brand-mark img,:root[data-theme=blue] .brand-mark img{filter:none}
.brand-name{font-weight:700;font-size:14.5px;line-height:1.2}
.brand-sub{font-size:10px;color:#8f8f8f;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navitem{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
  color:var(--nav-ink);font-size:13.5px;font-weight:500;border:none;background:transparent;text-align:left;width:100%;
}
.navitem svg{flex:0 0 18px}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.active{background:var(--nav-active-bg);color:var(--nav-active-ink);font-weight:700}
.nav-spacer{flex:1}
.nav-footer{font-size:10.5px;color:#777;padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);margin-top:10px}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.topbar-title{font-size:17px;font-weight:800;letter-spacing:-.2px}
.topbar-date{font-size:11.5px;color:var(--ink-soft);margin-top:1px;text-transform:uppercase;letter-spacing:.3px}
.topbar-right{display:flex;align-items:center;gap:8px}
.content{padding:22px 24px 90px;flex:1;max-width:1080px;margin:0 auto;width:100%}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;transition:border-color .15s,opacity .15s;
}
.btn svg{flex:0 0 15px}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn-primary:hover{opacity:.82;border-color:var(--btn-bg)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:5px}
.btn-block{width:100%;justify-content:center}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center}

/* ---------- CARDS / STATS ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat-card.clickable{cursor:pointer;transition:border-color .15s}
.stat-card.clickable:hover{border-color:var(--accent)}
.stat-card.clickable::after{content:'View';display:block;margin-top:8px;font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.stat-num{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.num-pos{color:var(--good)}
.num-neg{color:var(--bad)}

/* ---------- CALENDAR ---------- */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-title{font-weight:800;font-size:16px;flex:1;text-align:center}
.cal-title-btn{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--ink);font-weight:800;font-size:16px;padding:8px 6px;cursor:pointer}
.cal-title-btn:hover{border-color:var(--line);background:var(--surface-2)}
.cal-picker-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px}
.cal-month-chip{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:9px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink-soft)}
.cal-month-chip.active{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.cal-yr-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:14px}
.cal-yr-chip{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:6px;text-align:left;cursor:pointer;font-size:10px;color:var(--ink-soft);font-weight:700}
.cal-yr-chip.active{border-color:var(--accent);color:var(--ink)}
.cal-yr-chip b{display:block;font-size:11px;color:var(--ink)}
.cal-yr-chip span{color:var(--good)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10px;font-weight:800;color:var(--ink-soft);text-align:center;padding:3px 0;text-transform:uppercase}
.cal-day{position:relative;min-height:54px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:4px 5px;cursor:pointer;text-align:left}
.cal-day:hover{border-color:var(--accent)}
.cal-day.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal-day.blank{background:transparent;border:none;cursor:default}
.cal-num{font-size:12px;font-weight:800;color:var(--ink)}
.cal-amt{font-size:9.5px;font-weight:800;color:var(--good);position:absolute;bottom:4px;left:5px;white-space:nowrap;overflow:hidden;max-width:calc(100% - 10px)}
.cal-amt.neg{color:var(--bad)}
.cal-dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal-day.today{border-color:var(--accent)}
.cal-sel-title{font-size:14px;font-weight:800;margin:18px 0 2px}
.act-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.act-row:last-child{border-bottom:none}
.act-row .act-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-badge{flex:none;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.act-badge.sold{background:rgba(22,115,71,.12);color:var(--good)}
.act-badge.repair{background:rgba(31,111,235,.13);color:var(--accent)}
.act-badge.bought{background:rgba(180,83,9,.13);color:#b45309}
.act-badge.job{background:rgba(128,128,128,.15);color:var(--ink-soft)}
.act-amt{flex:none;font-weight:800;font-size:12px;color:var(--good)}
.act-amt.neg{color:#b45309}
.stat-label{font-size:10.5px;color:var(--ink-soft);margin-top:7px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card-pad{padding:20px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.section-title a{font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink-faint);cursor:pointer;font-weight:700}
.section-title a:hover{color:var(--ink)}

/* ---------- STUB LIST ---------- */
.stub-list{display:flex;flex-direction:column;gap:8px}
.stub{
  display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);cursor:pointer;transition:border-color .15s,background .15s;
}
.stub:hover{border-color:var(--line-strong);background:var(--surface-2)}
.stub-main{flex:1;min-width:0}
.stub-top{display:flex;align-items:center;gap:9px;min-width:0}
.stub-num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line);border-radius:99px;padding:2px 8px;flex:0 0 auto}
.stub-title{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stub-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stub-price{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:14px;flex:0 0 auto}

/* ---------- BADGES (monochrome) ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.2px;border:1px solid var(--line-strong);color:var(--ink-soft);flex:0 0 auto;white-space:nowrap}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-faint)}
.badge-progress{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.badge-progress::before{background:var(--btn-ink)}
.badge-fixed{border-color:var(--ink);color:var(--ink)}
.badge-fixed::before{background:var(--ink)}
.badge-pickedup{border-style:dashed}

/* ---------- FORMS ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
.input,.textarea,select.input{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface-2);font-size:14px;color:var(--ink);width:100%;
}
.input:focus,.textarea:focus{outline:2px solid var(--ink);outline-offset:1px;background:var(--surface)}
.textarea{resize:vertical;min-height:70px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 16px;background:var(--surface-2)}
legend{font-size:11px;font-weight:700;padding:0 6px;color:var(--ink);text-transform:uppercase;letter-spacing:.4px}

.item-row{display:grid;grid-template-columns:1.3fr 1fr .8fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.item-row input{padding:9px 10px;font-size:13px}
.remove-row{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}

.photo-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.photo-thumb{width:84px;height:84px;border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--line);flex:0 0 84px}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1}
.photo-add{
  width:84px;height:84px;border-radius:8px;border:1.5px dashed var(--line-strong);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--ink-soft);cursor:pointer;flex:0 0 84px;background:var(--surface-2);font-size:10.5px;font-weight:600;
}

/* ---------- SIGNATURE ---------- */
.sig-wrap{position:relative;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);overflow:hidden}
.sig-canvas{width:100%;height:150px;display:block;touch-action:none;cursor:crosshair;background:#fff}
.sig-expand{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.sig-expand:hover{color:var(--ink);border-color:var(--ink)}
.sig-actions{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.sig-hint{font-size:11.5px;color:var(--ink-faint)}

/* ---------- DETAIL ---------- */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.detail-title{font-size:21px;font-weight:800;letter-spacing:-.3px}
.detail-sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink-soft);font-size:12.5px;margin-top:3px}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:6px}
.kv{padding:11px 0;border-bottom:1px solid var(--line)}
.kv-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);font-weight:700;margin-bottom:3px}
.kv-val{font-size:14.5px;font-weight:600}
.pipeline{display:flex;gap:6px;margin:14px 0 18px}
.pipe-step{flex:1;text-align:center;padding:8px 6px;border-radius:var(--radius-sm);font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--line)}
.pipe-step.done{background:var(--nav-bg);color:#f2f2f2;border-color:var(--nav-bg)}
.pipe-step.now{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.items-table{width:100%;border-collapse:collapse;margin:10px 0 16px}
.items-table th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--ink-faint);padding:0 10px 8px;letter-spacing:.4px}
.items-table td{padding:10px;background:var(--surface-2);font-size:13.5px;border-top:3px solid var(--surface)}
.items-table tr td:first-child{border-radius:8px 0 0 8px}
.items-table tr td:last-child{border-radius:0 8px 8px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:right}
.gallery{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.gallery img{width:110px;height:110px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line);cursor:zoom-in}
.sig-preview{height:120px;border:1px solid var(--line);border-radius:var(--radius-sm);background-color:#fff;background-position:center;background-size:contain;background-repeat:no-repeat}
.empty-note{color:var(--ink-faint);font-size:13px;font-style:italic}

/* ---------- SEARCH ---------- */
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-row .input{max-width:320px;flex:1}
.filter-chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.filter-chip:hover{border-color:var(--line-strong)}
.filter-chip.active{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}

/* ---------- CUSTOMERS ---------- */
.hist-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hist-filters .input{flex:1;min-width:150px}
.p-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 320px);min-height:220px;overflow-y:auto;padding:2px 4px 2px 0}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .15s,background .15s}
.person:hover{border-color:var(--line-strong);background:var(--surface-2)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:0 0 38px}
.p-body{flex:1;min-width:0}
.p-top{display:flex;align-items:baseline;gap:8px}
.p-name{font-weight:700;font-size:14.5px}
.p-type{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px}
.p-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-chev{color:var(--ink-faint);flex:0 0 auto;transition:transform .15s;display:flex}
.person.open .p-chev{transform:rotate(180deg)}
.p-detail{display:flex;flex-direction:column;gap:8px;margin:2px 0 8px 50px}
.hist-count{font-size:11px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{display:none}

/* ---------- DIALOG ---------- */
dialog{border:1px solid var(--line-strong);border-radius:14px;padding:0;max-width:460px;width:92%;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:var(--backdrop)}
.modal-head{padding:18px 20px 6px;font-weight:800;font-size:16px}
.modal-body{padding:14px 20px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 20px}
#sigExpandDialog{max-width:min(94vw,920px);width:min(94vw,920px)}
#sigExpandDialog .sig-canvas{height:min(56vh,430px)}
#sigExpandDialog.portrait{max-width:min(94vw,560px);width:min(94vw,560px)}
#sigExpandDialog.portrait .sig-canvas{height:min(62vh,620px)}
.exp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--btn-bg);color:var(--btn-ink);
  padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- CUSTOM SCROLLBAR ---------- */
html::-webkit-scrollbar,body::-webkit-scrollbar{width:12px;height:12px}
html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:var(--surface)}

/* ---------- FULL-SCREEN FLIP (F key) ---------- */
html.flipped,html.flipped body{height:100%;overflow:hidden}
.flipped #flipWrap{
  transform:rotate(180deg);
  height:100vh;
  min-height:100vh;
  overflow:hidden;
}
.flipped #app{height:100vh;min-height:100vh}
.flipped .sidebar{position:static;top:auto;bottom:auto;height:100vh;overflow-y:auto}
.flipped .main{height:100vh;min-height:100vh}
.flipped .topbar{position:static;top:auto;bottom:auto;flex:0 0 auto}
.flipped .content{flex:1;min-height:0;overflow-y:auto}

/* ---------- PRINT ---------- */
#printFrame{position:absolute;left:-9999px;top:0;width:480px;height:640px;border:0}

/* ---------- RESPONSIVE ---------- */
@media (max-width:880px){
  .sidebar{display:none}
  .form-grid,.kv-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .content{padding:16px 14px 90px}
  .topbar{padding:11px 14px}
  .topbar-date{display:none}
  .p-detail{margin-left:0}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);z-index:60;
    border-top:1px solid rgba(255,255,255,.08);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  }
  .bottomnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#a0a0a0;
    font-size:10px;font-weight:700;padding:5px 2px;cursor:pointer;
  }
  .bottomnav button.active{color:#fff}
  .item-row{grid-template-columns:1fr;gap:6px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .remove-row{justify-self:end}
}

<script>
/* ===== service worker (self-registering; only runs inside SW context) ===== */
if (typeof document === 'undefined') {
  var CACHE = 'repairshop-v1';
  self.addEventListener('install', function(e){
    e.waitUntil(caches.open(CACHE).then(function(c){ return c.addAll(['./']); }).catch(function(){}).then(function(){ return self.skipWaiting(); }));
  });
  self.addEventListener('activate', function(e){ e.waitUntil(self.clients.claim()); });
  self.addEventListener('fetch', function(e){
    if (e.request.method !== 'GET') return;
    var url = new URL(e.request.url);
    if (url.origin !== location.origin) return;
    if (e.request.mode === 'navigate') {
      e.respondWith(fetch(e.request).then(function(r){ var c = r.clone(); caches.open(CACHE).then(function(ca){ ca.put('./', c); }); return r; }).catch(function(){ return caches.match('./'); }));
      return;
    }
    e.respondWith(caches.match(e.request).then(function(r){ return r || fetch(e.request); }));
  });
}
</script>

<script>
if (typeof document !== 'undefined') {
/* ============================= THEME ============================= */
var _theme = (function(){ try{ var t = localStorage.getItem('rs_theme'); if(t) return t; }catch(e){} return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; })();
document.documentElement.dataset.theme = _theme;
function isDark(){ return document.documentElement.dataset.theme === 'dark'; }
function themeName(){ return document.documentElement.dataset.theme; }
function setThemeColor(){ var el = document.getElementById('themeColor'); if(!el) return; el.content = themeName()==='blue' ? '#000cad' : (isDark() ? '#0b0b0b' : '#ffffff'); }
function renderThemeBtn(){ var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(themeName()==='blue' ? 'palette' : (isDark() ? 'sun' : 'moon'), 17); }
function logoVariant(){ return themeName()==='light' ? 'html-cytech-logo-black.png' : 'html-cytech-logo.png'; }
function updateLogoLinks(){
  var f = document.getElementById('favicon'); if(f) f.href = logoVariant();
  var a = document.getElementById('appleIcon'); if(a) a.href = logoVariant();
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('rs_theme', t); }catch(e){}
  setThemeColor(); renderThemeBtn(); updateLogoLinks();
}
function toggleTheme(){
  var t = themeName();
  if(t==='blue') setTheme('light');
  else if(t==='dark') setTheme('blue');
  else setTheme('dark');
}

/* ============================= FULL-SCREEN FLIP (F key) ============================= */
var __FLIPPED = false;
function toggleFlip(){
  __FLIPPED = !__FLIPPED;
  document.documentElement.classList.toggle('flipped', __FLIPPED);
  toast(__FLIPPED ? 'Screen flipped' : 'Screen restored');
  requestAnimationFrame(function(){ __redrawPads(); });
}
document.addEventListener('keydown', function(e){
  if((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey){
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    e.preventDefault();
    toggleFlip();
  }
});

/* ============================= DATA LAYER ============================= */
var DB_KEY = 'repairShopDB_v1';
function loadDB(){
  var db = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
  if(!db){
    db = {
      settings:{ shopName:'CyTECH ELECTRONICS', address:'1st April Avenue, 13A, 5281, Paralimni', phone:'+357 95653344', currency:'€', nextJob:1, nextPurchase:1 },
      jobs:[], purchases:[], stock:[]
    };
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }
  if(!Array.isArray(db.stock)) db.stock = [];
  syncStock(db);
  return db;
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
var DB = loadDB();

function isLightInk(url, cb){
  var im = new Image();
  im.onload = function(){
    var c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    var x = c.getContext('2d');
    x.drawImage(im, 0, 0);
    try{
      var d = x.getImageData(0, 0, c.width, c.height).data;
      var lum = 0, n = 0;
      for(var i = 0; i < d.length; i += 4){
        if(d[i+3] > 40){ lum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]; n++; }
      }
      cb(n > 0 && (lum / n) > 128);
    }catch(e){ cb(false); }
  };
  im.onerror = function(){ cb(false); };
  im.src = url;
}
function toBlackInk(url, cb){
  var im = new Image();
  im.onload = function(){
    var c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    var x = c.getContext('2d');
    x.drawImage(im, 0, 0);
    var d = x.getImageData(0, 0, c.width, c.height);
    for(var i = 0; i < d.data.length; i += 4){
      d.data[i] = 255 - d.data[i];
      d.data[i+1] = 255 - d.data[i+1];
      d.data[i+2] = 255 - d.data[i+2];
    }
    x.putImageData(d, 0, 0);
    cb(c.toDataURL('image/png'));
  };
  im.onerror = function(){ cb(url); };
  im.src = url;
}
function migrateSignatures(db){
  var items = [];
  db.jobs.forEach(function(j){
    if(j.signatureIntake) items.push({ rec: j, key: 'signatureIntake' });
    if(j.signaturePickup) items.push({ rec: j, key: 'signaturePickup' });
  });
  db.purchases.forEach(function(p){
    if(p.signature) items.push({ rec: p, key: 'signature' });
  });
  if(!items.length) return;
  var pending = items.length, changed = false;
  items.forEach(function(it){
    isLightInk(it.rec[it.key], function(light){
      if(light){
        changed = true;
        toBlackInk(it.rec[it.key], function(black){
          it.rec[it.key] = black;
          if(--pending === 0 && changed) saveDB(db);
        });
      } else if(--pending === 0 && changed) {
        saveDB(db);
      }
    });
  });
}
migrateSignatures(DB);

/* ============================= PROFIT ============================= */
function profitEntries(){
  var out = [];
  DB.stock.forEach(function(s){
    if(s.status === 'sold' && s.dateSold){
      out.push({
        date: s.dateSold, type: 'sold-item',
        label: (s.name || 'Item') + (s.serial ? ' (' + s.serial + ')' : ''),
        amount: (Number(s.priceSold) || 0) - (Number(s.pricePaid) || 0),
        ref: s.id
      });
    }
  });
  DB.jobs.forEach(function(j){
    if(j.status === 'pickedup' && j.pickedUpDate){
      var dep = Number(j.priceDeposit) || 0;
      var fin = Number(j.finalPayment);
      if(!(fin > 0)) fin = Math.max(0, (Number(j.priceNeeded) || 0) - dep);
      out.push({
        date: j.pickedUpDate, type: 'repair',
        label: (j.customerName || 'Customer') + ' &middot; ' + ((j.items && j.items[0] && j.items[0].name) || 'repair'),
        amount: dep + fin,
        ref: j.id
      });
    }
  });
  out.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return out;
}
function totalProfit(){ return profitEntries().reduce(function(s, e){ return s + e.amount; }, 0); }
function profitForMonth(y, m){
  var p = String(m + 1); if(p.length < 2) p = '0' + p;
  var prefix = y + '-' + p;
  return profitEntries().filter(function(e){ return e.date.indexOf(prefix) === 0; });
}
function profitForDay(date){
  return profitEntries().filter(function(e){ return e.date === date; });
}
function activityForDay(date){
  var jobs = DB.jobs.filter(function(j){ return j.dateReceived === date; });
  var pickups = DB.jobs.filter(function(j){ return j.status === 'pickedup' && j.pickedUpDate === date; });
  var purchases = DB.purchases.filter(function(p){ return p.date === date; });
  return { jobs: jobs, pickups: pickups, purchases: purchases };
}
function showProfitDialog(){
  var entries = profitEntries();
  var total = entries.reduce(function(s, e){ return s + e.amount; }, 0);
  var rows = entries.slice().reverse().map(function(e){
    var t = e.type === 'repair' ? 'Repair job' : 'Sold item';
    var cls = e.type === 'repair' ? 'repair' : 'sold';
    return '<div class="act-row">'+
      '<span class="act-badge '+cls+'">'+t+'</span>'+
      '<span class="act-label">'+fmtDate(e.date)+' &middot; '+e.label+'</span>'+
      '<span class="act-amt">+'+fmtMoney(e.amount)+'</span></div>';
  }).join('');
  document.getElementById('profitDialogBody').innerHTML =
    '<div class="stats-grid" style="margin-bottom:10px">'+
      '<div class="stat-card"><div class="stat-num '+(total>=0?'num-pos':'num-neg')+'">'+fmtMoney(total)+'</div><div class="stat-label">Total profit</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+entries.filter(function(e){ return e.type==='repair'; }).length+'</div><div class="stat-label">Repair jobs</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+entries.filter(function(e){ return e.type==='sold-item'; }).length+'</div><div class="stat-label">Items sold</div></div>'+
    '</div>'+
    '<div class="card card-pad" style="max-height:340px;overflow:auto">'+
      (rows || '<div class="empty-note">No profit yet. Profit comes from sold stock items and repair jobs that have been picked up.</div>')+
    '</div>'+
    '<p style="font-size:11px;color:var(--ink-soft);margin-top:8px">Sold item = sale price &minus; cost paid. Repair = deposit + final payment, counted on the pickup date.</p>';
  document.getElementById('profitDialog').showModal();
}

function syncStock(db){
  var changed = false;
  db.purchases.forEach(function(p){
    (p.items||[]).forEach(function(it, idx){
      var key = p.id + '_' + idx;
      var found = db.stock.filter(function(s){ return s.pkey === key; })[0];
      if(found){
        if(found.name !== it.name || (found.serial||'') !== (it.serial||'') || Number(found.pricePaid) !== Number(it.price||0)){
          found.name = it.name; found.serial = it.serial||''; found.pricePaid = Number(it.price)||0;
          changed = true;
        }
      } else {
        db.stock.push({
          id: uid(), pkey: key, name: it.name||'', serial: it.serial||'',
          pricePaid: Number(it.price)||0, dateBought: p.date, purchaseNumber: p.number,
          status: 'in', priceSold: null, dateSold: null
        });
        changed = true;
      }
    });
  });
  if(changed) saveDB(db);
}

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ n = Number(n)||0; return DB.settings.currency + n.toFixed(2); }
function fmtDate(d){ if(!d) return '—'; var dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function pad4(n){ return String(n).padStart(4,'0'); }

/* ============================= SIGNATURE PAD ============================= */
var __pads = [];
function __redrawPads(){
  __pads = __pads.filter(function(p){ return p.__canvas.isConnected && p.__canvas.__sigPad === p; });
  __pads.forEach(function(p){ p.redraw(); });
}
var __rsPend = false;
window.addEventListener('resize', function(){
  if(__rsPend) return;
  __rsPend = true;
  requestAnimationFrame(function(){ __rsPend = false; __redrawPads(); });
});
function makeSignaturePad(canvas){
  var ctx = canvas.getContext('2d');
  var INK = '#0f0f0f';
  var INK_LW = 2.4;
  var S = { w0: 0, h0: 0, strokes: [], img: null };
  var drawing = false;

  function padSize(){
    var r = canvas.getBoundingClientRect();
    if(r.width < 1 || r.height < 1) return null;
    return { w: r.width, h: r.height };
  }
  function ensureBitmap(w, h){
    var ratio = window.devicePixelRatio || 1;
    var bw = Math.round(w*ratio), bh = Math.round(h*ratio);
    if(canvas.width !== bw || canvas.height !== bh){
      canvas.width = bw; canvas.height = bh;
    }
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  function contentMap(w, h){
    if(!S.w0 || !S.h0) return null;
    var s = Math.min(w/S.w0, h/S.h0);
    var dw = S.w0*s, dh = S.h0*s;
    return { s: s, dw: dw, dh: dh, ox: (w-dw)/2, oy: (h-dh)/2 };
  }
  function drawStrokes(w, h){
    var m = contentMap(w, h);
    if(!m) return;
    var lw = INK_LW * m.s;
    ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    S.strokes.forEach(function(st){
      if(st.p.length === 1){
        ctx.beginPath();
        ctx.arc(m.ox + st.p[0].x*m.dw, m.oy + st.p[0].y*m.dh, Math.max(1.5, lw*0.85), 0, Math.PI*2);
        ctx.fill();
      } else if(st.p.length > 1){
        ctx.beginPath();
        ctx.moveTo(m.ox + st.p[0].x*m.dw, m.oy + st.p[0].y*m.dh);
        for(var i=1; i<st.p.length; i++) ctx.lineTo(m.ox + st.p[i].x*m.dw, m.oy + st.p[i].y*m.dh);
        ctx.stroke();
      }
    });
  }
  function paint(){
    var p = padSize();
    if(!p) return;
    ensureBitmap(p.w, p.h);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = INK; ctx.fillStyle = INK;
    ctx.clearRect(0, 0, p.w, p.h);
    if(S.img){
      var im = new Image();
      im.onload = function(){
        var s = Math.min(p.w/im.width, p.h/im.height);
        var dw = im.width*s, dh = im.height*s;
        if(!S.w0){ S.w0 = im.naturalWidth; S.h0 = im.naturalHeight; }
        ctx.clearRect(0, 0, p.w, p.h);
        ctx.drawImage(im, (p.w-dw)/2, (p.h-dh)/2, dw, dh);
        drawStrokes(p.w, p.h);
      };
      im.src = S.img;
    } else {
      drawStrokes(p.w, p.h);
    }
  }
  function pos(e){
    var t = e.touches ? e.touches[0] : e;
    var r = canvas.getBoundingClientRect();
    var x = t.clientX - r.left, y = t.clientY - r.top;
    if(__FLIPPED){
      x = r.width - x;
      y = r.height - y;
    }
    return { x: x, y: y };
  }
  function start(e){
    e.preventDefault();
    drawing = true;
    var p = padSize(); if(!p) return;
    if(!S.w0){ S.w0 = p.w; S.h0 = p.h; }
    var m = contentMap(p.w, p.h);
    var q = pos(e);
    S.strokes.push({ p: [{ x: (q.x - m.ox)/m.dw, y: (q.y - m.oy)/m.dh }] });
    paint();
  }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    var p = padSize(); if(!p) return;
    var m = contentMap(p.w, p.h);
    var q = pos(e);
    S.strokes[S.strokes.length-1].p.push({ x: (q.x - m.ox)/m.dw, y: (q.y - m.oy)/m.dh });
    paint();
  }
  function end(){ drawing = false; }
  if(window.PointerEvent){
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  } else {
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
  }
  if(canvas.__sigRO){ try{ canvas.__sigRO.disconnect(); }catch(e){} }
  try{
    canvas.__sigRO = new ResizeObserver(function(){ paint(); });
    canvas.__sigRO.observe(canvas);
  }catch(e){}
  setTimeout(paint, 0);
  var api = {
    clear: function(){ S.strokes.length = 0; S.img = null; S.w0 = 0; S.h0 = 0; paint(); },
    isEmpty: function(){ return S.strokes.length === 0 && !S.img; },
    dataURL: function(){ return canvas.toDataURL('image/png'); },
    load: function(url){ S.strokes.length = 0; S.img = url; paint(); },
    redraw: function(){ paint(); },
    _state: function(){ return S; },
    _link: function(src){ S = src._state(); paint(); },
    __canvas: canvas
  };
  canvas.__sigPad = api;
  __pads.push(api);
  return api;
}

function expandSig(pad){

/* ============================= PHOTO HANDLING ============================= */
function fileToCompressedDataURL(file, maxDim, quality){
  maxDim = maxDim||900; quality = quality||0.72;
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function photoStripHTML(photos, editable){
  var html = '<div class="photo-strip">';
  photos.forEach(function(p,i){
    html += '<div class="photo-thumb"><img src="'+p+'" onclick="openImg(\''+p.replace(/'/g,"\\'")+'\')">'+(editable?'<button class="rm" onclick="removePhoto('+i+',event)">'+icon('close',11)+'</button>':'')+'</div>';
  });
  if(editable){
    html += '<label class="photo-add">'+icon('camera',20)+'Add<input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="addPhotos(this.files)"></label>';
  }
  html += '</div>';
  return html;
}

function saveJob(id){

  var sigPad = window.__jobSigPad;
  var signature = sigPad.isEmpty() ? null : sigPad.dataURL();

  var payload = {
    customerName: customerName,
    phone: document.getElementById('f_phone').value.trim(),
    dateReceived: dateReceived,
    dateExpected: document.getElementById('f_dateExpected').value,

    finalPayment: document.getElementById('f_finalPayment').value || 0,
    notes: document.getElementById('f_notes').value.trim(),
    photos: FORM_PHOTOS.slice(),
    signatureIntake: signature
  };

  if(id){

    '<div class="stub-main">'+
      '<div class="stub-top">'+(s.serial?'<span class="stub-num">'+escapeHTML(s.serial)+'</span>':'')+'<span class="stub-title">'+escapeHTML(s.name||'Unnamed item')+'</span>'+(s.status==='sold'?'<span class="badge badge-fixed">Sold</span>':'<span class="badge">In stock</span>')+'</div>'+

function markStockSold(){
  var s = DB.stock.find(function(x){ return x.id===__stockSel; });

  if(price==='' || !(Number(price)>=0)) return toast('Enter a valid sell price');
  if(!date) return toast('Date is required');
  s.status='sold'; s.priceSold=Number(price); s.dateSold=date;
  saveDB(DB); document.getElementById('stockDialog').close();
  toast('Marked sold &middot; profit '+fmtMoney(Number(price)-(Number(s.pricePaid)||0)));
  render();
}
function undoStockSale(){
  var s = DB.stock.find(function(x){ return x.id===__stockSel; });
  s.status='in'; s.priceSold=null; s.dateSold=null;
  saveDB(DB); document.getElementById('stockDialog').close();
  toast('Back in stock'); render();
}
function deleteStockItem(){
  if(!confirm('Delete this stock item? This cannot be undone.')) return;
  DB.stock = DB.stock.filter(function(x){ return x.id!==__stockSel; });
  saveDB(DB); document.getElementById('stockDialog').close();
  toast('Stock item deleted'); render();
}
function openStockAdd(){

  document.getElementById('a_price').value=''; document.getElementById('a_date').value=todayStr();
  document.getElementById('stockAddDialog').showModal();
}
function addStockItem(){

}

/* ============================= CUSTOMERS (always-visible previews) ============================= */
var HIST = { q:'', item:'', from:'', to:'' };
function renderHistory(c){
  setTopbar('Customers','','');
  c.innerHTML = ''+
    '<div class="hist-filters">'+
      '<input class="input" id="h_q" placeholder="Name or phone">'+
      '<input class="input" id="h_item" placeholder="Item / serial">'+
      '<input class="input" type="date" id="h_from" title="From date">'+
      '<input class="input" type="date" id="h_to" title="To date">'+
    '</div>'+
    '<div class="section-title">People<span class="hist-count" id="histCount"></span></div>'+
    '<div class="p-list" id="histList"></div>';
  ['h_q','h_item','h_from','h_to'].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener('input', histRender);
  });
  histRender();
}
function buildPeople(){
  var map = new Map();
  DB.jobs.forEach(function(j){
    var key = (j.customerName||'Unknown customer').trim().toLowerCase();
    if(!map.has(key)) map.set(key,{ name:j.customerName||'Unknown customer', phone:j.phone||'', jobs:[], purs:[], last:0 });
    var p = map.get(key); p.jobs.push(j); p.last = Math.max(p.last, j.createdAt||0);
  });
  DB.purchases.forEach(function(x){
    var key = (x.sellerName||'Unknown seller').trim().toLowerCase();
    if(!map.has(key)) map.set(key,{ name:x.sellerName||'Unknown seller', phone:'', jobs:[], purs:[], last:0 });
    var p = map.get(key); p.purs.push(x); p.last = Math.max(p.last, x.createdAt||0);
  });
  return Array.from(map.values()).sort(function(a,b){ return b.last-a.last; });
}
function personMatches(p){
  var q = HIST.q.trim().toLowerCase();
  if(q && p.name.toLowerCase().indexOf(q)<0 && ((p.phone||'').toLowerCase().indexOf(q)<0)) return false;
  var item = HIST.item.trim().toLowerCase();
  var recs = p.jobs.map(function(j){ return { date:j.dateReceived, text:(j.items||[]).map(function(i){ return ((i.name||'')+' '+(i.model||'')).trim(); }).join(' ').toLowerCase() }; })
    .concat(p.purs.map(function(x){ return { date:x.date, text:(x.items||[]).map(function(i){ return ((i.name||'')+' '+(i.serial||'')).trim(); }).join(' ').toLowerCase() }; }));
  return recs.some(function(r){
    if(item && r.text.indexOf(item)<0) return false;
    if(HIST.from && r.date < HIST.from) return false;
    if(HIST.to && r.date > HIST.to) return false;
    return true;
  });
}
function histRender(){
  var zone = document.getElementById('histList'); if(!zone) return;
  HIST.q = document.getElementById('h_q').value;
  HIST.item = document.getElementById('h_item').value;
  HIST.from = document.getElementById('h_from').value;
  HIST.to = document.getElementById('h_to').value;
  var people = buildPeople().filter(personMatches);
  document.getElementById('histCount').textContent = people.length + ' ' + (people.length===1?'person':'people');
  zone.innerHTML = people.length ? people.map(function(p){
    var initials = (p.name||'?').trim().split(/\s+/).map(function(w){ return w.charAt(0)||''; }).join('').toUpperCase().slice(0,2);
    var tag = (p.jobs.length && p.purs.length) ? 'customer &middot; seller' : (p.jobs.length ? 'customer' : 'seller');
    var last = p.last ? new Date(p.last).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '—';
    var meta = (p.phone||'no phone') + ' &middot; ' + p.jobs.length + ' repair' + (p.jobs.length===1?'':'s') + ' &middot; ' + p.purs.length + ' purchase' + (p.purs.length===1?'':'s') + ' &middot; last ' + last;
    var detail = p.jobs.slice().sort(function(a,b){ return b.createdAt-a.createdAt; }).map(jobStubHTML).join('')
               + p.purs.slice().sort(function(a,b){ return b.createdAt-a.createdAt; }).map(purStubHTML).join('');
    if(!detail) detail = '<div class="empty-note">No records.</div>';
    return '<div class="person" onclick="togglePerson(this)">'+
        '<div class="avatar">'+initials+'</div>'+
        '<div class="p-body"><div class="p-top"><span class="p-name">'+escapeHTML(p.name)+'</span><span class="p-type">'+tag+'</span></div>'+
        '<div class="p-meta">'+meta+'</div></div>'+
        '<div class="p-chev">'+icon('chevron',16)+'</div>'+
      '</div>'+
      '<div class="p-detail hidden">'+detail+'</div>';
  }).join('') : emptyNote('No matching people.');
}
function togglePerson(el){
  el.classList.toggle('open');
  var d = el.nextElementSibling;
  if(d) d.classList.toggle('hidden');
}

function saveSettings(){
  DB.settings.shopName = document.getElementById('s_name').value.trim() || 'CyTECH ELECTRONICS';
  DB.settings.address = document.getElementById('s_address').value.trim();
  DB.settings.phone = document.getElementById('s_phone').value.trim();
  DB.settings.currency = document.getElementById('s_currency').value.trim() || '€';
  var t = document.getElementById('s_theme'); if(t) setTheme(t.value);
  saveDB(DB); toast('Settings saved'); render();
}
function exportData(){
  var blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'shop-ledger-backup-'+todayStr()+'.json'; a.click();
}
function importData(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data.jobs || !data.purchases || !data.settings) throw 0;
      DB = data; saveDB(DB); toast('Backup imported'); navigate('dashboard');
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
}
function wipeData(){
  if(!confirm('This will permanently erase every repair job and purchase on this device. Continue?')) return;
  if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
  localStorage.removeItem(DB_KEY); DB = loadDB(); toast('All data erased'); navigate('dashboard');
}

/* ============================= CALENDAR ============================= */
var CAL = { y: 0, m: 0, day: null, pickerOpen: false };
var CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var CAL_DOW = ['S','M','T','W','T','F','S'];
function calToday(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1 < 10 ? '0' : '') + (d.getMonth()+1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate(); }
function calTogglePicker(){ CAL.pickerOpen = !CAL.pickerOpen; render(); }
function calJumpToday(){ var d = new Date(); CAL.y = d.getFullYear(); CAL.m = d.getMonth(); CAL.day = calToday(); CAL.pickerOpen = false; render(); }
function calYears(){
  var set = {};
  set[new Date().getFullYear()] = true;
  profitEntries().forEach(function(e){ set[+e.date.slice(0,4)] = true; });
  DB.jobs.forEach(function(j){ set[+(j.dateReceived||'').slice(0,4)] = true; });
  DB.purchases.forEach(function(p){ set[+(p.date||'').slice(0,4)] = true; });
  return Object.keys(set).map(Number).sort(function(a,b){ return b-a; });
}
function calSelectMonth(y, m){ CAL.y = y; CAL.m = m; CAL.day = null; CAL.pickerOpen = false; render(); }
function calSelectDay(day){ CAL.day = CAL.day === day ? null : day; render(); }
function calMonthProfitRow(prefix){
  var sum = 0, n = 0;
  profitEntries().forEach(function(e){
    if(e.date.indexOf(prefix) === 0){ sum += e.amount; n++; }
  });
  return { sum: sum, n: n };
}
function renderCalendar(c){
  var now = new Date();
  if(!CAL.y){ CAL.y = now.getFullYear(); CAL.m = now.getMonth(); CAL.day = calToday(); }
  setTopbar('Calendar','','');
  var prefix = CAL.y + '-' + (CAL.m+1 < 10 ? '0' : '') + (CAL.m+1);
  var monthStat = calMonthProfitRow(prefix);
  var soldInMonth = profitEntries().filter(function(e){ return e.date.indexOf(prefix) === 0 && e.type === 'sold-item'; }).length;
  var repairsInMonth = profitEntries().filter(function(e){ return e.date.indexOf(prefix) === 0 && e.type === 'repair'; }).length;
  var spentInMonth = DB.purchases.filter(function(p){ return (p.date||'').indexOf(prefix) === 0; }).reduce(function(s,p){ return s + p.items.reduce(function(a,i){ return a+(Number(i.price)||0); },0); },0);

  var first = new Date(CAL.y, CAL.m, 1);
  var startDow = first.getDay();
  var daysIn = new Date(CAL.y, CAL.m+1, 0).getDate();
  var today = calToday();

  var years = calYears();
  var monthGrid = CAL_MONTHS.map(function(name, i){
    return '<button class="cal-month-chip'+(i===CAL.m?' active':'')+'" onclick="calSelectMonth('+CAL.y+','+i+')">'+name.slice(0,3)+'</button>';
  }).join('');

  var strip = years.map(function(y){
    var yrSum = 0;
    for(var mi = 0; mi < 12; mi++){
      var pp = y + '-' + (mi+1 < 10 ? '0' : '') + (mi+1);
      yrSum += calMonthProfitRow(pp).sum;
    }
    return '<button class="cal-yr-chip'+(y===CAL.y?' active':'')+'" onclick="calSelectMonth('+y+','+CAL.m+')">'+y+'<b>'+fmtMoney(yrSum)+'</b></button>';
  }).join('');

  var cells = '';
  for(var i = 0; i < startDow; i++) cells += '<div class="cal-day blank"></div>';
  for(var d = 1; d <= daysIn; d++){
    var ds = prefix + '-' + (d < 10 ? '0' : '') + d;
    var dayProfit = profitForDay(ds).reduce(function(s,e){ return s+e.amount; }, 0);
    var act = activityForDay(ds);
    var hasActivity = dayProfit !== 0 || act.jobs.length || act.pickups.length || act.purchases.length;
    var amt = dayProfit !== 0 ? '<div class="cal-amt'+(dayProfit<0?' neg':'')+'">'+fmtMoney(dayProfit)+'</div>' : '';
    cells += '<div class="cal-day'+(CAL.day===ds?' sel':'')+(ds===today?' today':'')+'" onclick="calSelectDay(\''+ds+'\')"><div class="cal-num">'+d+'</div>'+amt+(hasActivity?'<div class="cal-dot"></div>':'')+'</div>';
  }

  var selHTML = '';
  if(CAL.day){
    var dayProfit = profitForDay(CAL.day);
    var act = activityForDay(CAL.day);
    var rows = '';
    if(!dayProfit.length && !act.jobs.length && !act.pickups.length && !act.purchases.length){
      rows = '<div class="empty-note">Nothing happened on '+fmtDate(CAL.day)+'.</div>';
    } else {
      dayProfit.forEach(function(e){
        rows += '<div class="act-row">'+
          '<span class="act-badge '+(e.type==='repair'?'repair':'sold')+'">'+(e.type==='repair'?'Repair':'Sold item')+'</span>'+
          '<span class="act-label">'+e.label+'</span>'+
          '<span class="act-amt">+'+fmtMoney(e.amount)+'</span></div>';
      });
      act.pickups.forEach(function(j){
        var pamt = (Number(j.priceDeposit)||0) + (Math.max(0, Number(j.finalPayment)) || 0);
        rows += '<div class="act-row"><span class="act-badge repair">Picked up</span><span class="act-label">'+escapeHTML(j.customerName)+' &middot; RJ-'+pad4(j.number)+'</span><span class="act-amt">+'+fmtMoney(pamt)+'</span></div>';
      });
      act.jobs.forEach(function(j){
        rows += '<div class="act-row"><span class="act-badge job">Job in</span><span class="act-label">'+escapeHTML(j.customerName)+' &middot; RJ-'+pad4(j.number)+'</span></div>';
      });
      act.purchases.forEach(function(p){
        var tot = p.items.reduce(function(s,i){ return s+(Number(i.price)||0); },0);
        var names = p.items.map(function(i){ return i.name; }).filter(Boolean).join(', ');
        rows += '<div class="act-row"><span class="act-badge bought">Parts bought</span><span class="act-label">'+escapeHTML(p.sellerName||'')+' &middot; '+escapeHTML(names||'purchase')+'</span><span class="act-amt neg">&minus;'+fmtMoney(tot)+'</span></div>';
      });
    }
    selHTML = '<div class="cal-sel-title">'+fmtDate(CAL.day)+'</div>'+
      '<div class="stats-grid" style="margin-bottom:8px">'+
        '<div class="stat-card"><div class="stat-num '+(dayProfit.reduce(function(s,e){return s+e.amount;},0)>=0?'num-pos':'num-neg')+'">'+fmtMoney(dayProfit.reduce(function(s,e){return s+e.amount;},0))+'</div><div class="stat-label">Profit that day</div></div>'+
        '<div class="stat-card"><div class="stat-num">'+act.jobs.length+'</div><div class="stat-label">Jobs received</div></div>'+
        '<div class="stat-card"><div class="stat-num">'+act.pickups.length+'</div><div class="stat-label">Pickups</div></div>'+
      '</div>'+
      '<div class="card card-pad">'+rows+'</div>';
  }

  c.innerHTML = ''+
  '<div class="card card-pad" style="max-width:820px">'+
    '<div class="cal-head">'+
      '<button class="btn" onclick="calSelectMonth('+(CAL.m===0?CAL.y-1:CAL.y)+','+(CAL.m===0?11:CAL.m-1)+')">'+icon('back',15)+'</button>'+
      '<button class="cal-title-btn" onclick="calTogglePicker()">'+CAL_MONTHS[CAL.m]+' '+CAL.y+icon('chevron',13)+'</button>'+
      '<button class="btn btn-sm" onclick="calJumpToday()">Today</button>'+
      '<button class="btn" onclick="calSelectMonth('+(CAL.m===11?CAL.y+1:CAL.y)+','+(CAL.m===11?0:CAL.m+1)+')">'+icon('right',15)+'</button>'+
    '</div>'+
    (CAL.pickerOpen ? '<div class="cal-picker-panel">'+monthGrid+'</div>' : '')+
    '<div class="cal-yr-strip">'+strip+'</div>'+
    '<div class="stats-grid" style="margin-bottom:14px">'+
      '<div class="stat-card"><div class="stat-num '+(monthStat.sum>=0?'num-pos':'num-neg')+'">'+fmtMoney(monthStat.sum)+'</div><div class="stat-label">Profit '+CAL_MONTHS[CAL.m].slice(0,3)+'</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+repairsInMonth+'</div><div class="stat-label">Repairs done</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+soldInMonth+'</div><div class="stat-label">Items sold</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+fmtMoney(spentInMonth)+'</div><div class="stat-label">Parts bought</div></div>'+
    '</div>'+
    '<div class="cal-grid">'+CAL_DOW.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('')+cells+'</div>'+
    '<p style="font-size:11px;color:var(--ink-soft);margin-top:10px">Profit counts sold items (sale price &minus; cost) and repairs when picked up (deposit + final payment). Green amounts are profit, brown is money spent on parts that day.</p>'+
  '</div>'+
  selHTML;
}

    '<div class="row"><b>Date:</b> '+fmtDate(pur.date)+'</div>'+
    '<table><tr><th>Item</th><th>Serial number</th><th class="num">Price paid</th></tr>'+
      pur.items.map(function(i){ return '<tr><td>'+escapeHTML(i.name)+'</td><td>'+escapeHTML(i.serial||'—')+'</td><td class="num">'+fmtMoney(i.price)+'</td></tr>'; }).join('')+
    '</table>'+
    '<div class="total">Total paid: '+fmtMoney(total)+'</div>'+
    (pur.signature?'<div class="sig"><div class="sig-label">Seller signature</div><img src="'+pur.signature+'"></div>':'')+
    '<div class="foot">'+escapeHTML(DB.settings.shopName)+' &middot; '+fmtDate(todayStr())+'</div>');
}

/* ============================= PWA (manifest + icon + SW) ============================= */
function makeIcon(size){
  var c = document.createElement('canvas'); c.width = c.height = size;
  var x = c.getContext('2d');
  x.fillStyle = '#0f0f0f';
  if(x.roundRect){ x.beginPath(); x.roundRect(0,0,size,size,size*0.16); x.fill(); } else { x.fillRect(0,0,size,size); }
  x.fillStyle = '#ffffff';
  var p = new Path2D('M13 2 3 14h7l-1 8 10-12h-7l1-8z');
  var s = size/512;
  x.save(); x.scale(s,s); x.translate(137,106); x.scale(14.9,14.9); x.fill(p); x.restore();
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    var icon192 = makeIcon(192), icon512 = makeIcon(512);
    updateLogoLinks();
    var link = document.getElementById('manifestLink');
    if(link && location.protocol.indexOf('http') !== 0){
      var manifest = {
        id: '.',
        name: DB.settings.shopName || 'CyTECH ELECTRONICS',
        short_name: 'Repairs',
        description: 'Offline repair job tickets and purchase receipts, with photos, signatures, calendar and profit tracking.',
        lang: 'en', dir: 'ltr',
        start_url: '.', scope: '.',
        display: 'fullscreen',
        display_override: ['fullscreen','standalone','minimal-ui','browser'],
        orientation: 'any',
        background_color: '#ffffff', theme_color: themeName()==='blue' ? '#000cad' : (isDark() ? '#0b0b0b' : '#ffffff'),
        categories: ['business','productivity','utilities'],
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    }
  }catch(e){}
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}

/* ============================= INIT ============================= */
setThemeColor(); renderThemeBtn(); setupPWA(); render();
}
